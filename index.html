<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeerJS Video Call</title>
    <!-- PeerJS Library CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: white; margin: 0; padding: 20px; }
        .status { margin: 15px 0; font-weight: bold; color: #00e676; word-break: break-all; }
        .video-container { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 20px; }
        .video-box { width: 100%; max-width: 360px; height: 270px; background: #000; border-radius: 10px; border: 2px solid #333; overflow: hidden; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .video-box p { position: absolute; top: 10px; left: 10px; z-index: 10; margin: 0; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>

    <h2>PeerJS Direct Video Call</h2>
    <div id="status" class="status">ক্যামেরা ও কানেকশন রেডি হচ্ছে...</div>

    <div class="video-container">
        <div class="video-box">
            <p>আপনার ক্যামেরা</p>
            <video id="localVideo" autoplay muted playsinline></video>
        </div>
        <div class="video-box">
            <p>অপরদিকের ক্যামেরা</p>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <script>
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const statusDiv = document.getElementById('status');

        let localStream;
        let peer;

        // ১. ক্যামেরা চালু করা
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                localStream = stream;
                localVideo.srcObject = stream;
                statusDiv.innerText = "ক্যামেরা চালু হয়েছে। সার্ভারে কানেক্ট হচ্ছে...";
                
                initPeer();
            })
            .catch(err => {
                statusDiv.innerText = "ক্যামেরা পারমিশন পাওয়া যায়নি!";
                console.error(err);
            });
function initPeer() {
    let roomID = location.hash.substring(1);

    // TURN Server কনফিগারেশন যোগ করা হলো
    const peerConfig = {
        config: {
            'iceServers': [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                // এগুলো পাবলিক TURN সার্ভার, যা ফায়ারওয়াল পার হতে সাহায্য করবে
                { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
                { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
            ]
        }
    };

    if (!roomID) {
        // ১ম ইউজার (Host)
        roomID = Math.random().toString(36).substring(2, 9);
        location.hash = roomID;
        
        // এখানে কনফিগারেশন যোগ করুন
        peer = new Peer(roomID, peerConfig);

        peer.on('open', id => {
            statusDiv.innerText = "আপনার রুম রেডি! লিঙ্কটি কপি করে ২য় ফোনে পাঠান।";
        });

        peer.on('call', call => {
            call.answer(localStream);
            call.on('stream', remoteStream => {
                remoteVideo.srcObject = remoteStream;
                statusDiv.innerText = "ভিডিও কল সফলভাবে কানেক্ট হয়েছে!";
            });
        });

    } else {
        // ২য় ইউজার (Guest)
        // এখানেও কনফিগারেশন যোগ করুন
        peer = new Peer(undefined, peerConfig);

        peer.on('open', id => {
            statusDiv.innerText = "১ম ইউজারের সাথে কানেক্ট করা হচ্ছে...";
            const call = peer.call(roomID, localStream);
            
            call.on('stream', remoteStream => {
                remoteVideo.srcObject = remoteStream;
                statusDiv.innerText = "ভিডিও কল সফলভাবে কানেক্ট হয়েছে!";
            });
        });
    }

    // এরর হ্যান্ডলিং
    peer.on("error", err => {
        statusDiv.innerText = "Error: " + err.type;
        console.error(err);
    });
}

    </script>
</body>
</html>
